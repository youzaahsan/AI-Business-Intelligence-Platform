[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbi"
version = "1.0.0"
description = "Multi-Agent AI Research & Business Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "scikit-learn>=1.4.1.post1"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=app"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
asyncio_mode = "auto"
